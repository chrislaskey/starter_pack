[package]
name = "ecto_changeset"
version = "0.1.0"
edition = "2024"
description = "Ecto.Changeset's cast and validations, and Plug's form decoding, for the Rust that mix app.rust writes from a universal changeset"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-segmentation = "1"
