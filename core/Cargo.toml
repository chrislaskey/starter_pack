[package]
name = "app_core"
description = "Starter Pack's application logic, shared by the web server and the Tauri app"
version.workspace = true
edition.workspace = true

[features]
default = ["sqlite"]
# The database each deployment keeps on its own device, and the web server's by default
sqlite = ["sqlx/sqlite"]
# The web server's database when it outgrows a file; never in the Tauri app
postgres = ["sqlx/postgres"]
# The HTTP transport to the web server's sync endpoints, for the apps; never on the server
sync-http = ["dep:reqwest"]

[dependencies]
argon2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros", "migrate", "chrono", "json", "uuid"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
