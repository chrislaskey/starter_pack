# The Rust workspace: the three crates share one target/ and one Cargo.lock,
# so app_core compiles once for the web server and the Tauri app.
[workspace]
resolver = "3"
members = ["core", "axum", "tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
app_core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Tauri's size guidance, see https://tauri.app/concept/size/#cargo-configuration.
# Profiles are read from the workspace root only.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
