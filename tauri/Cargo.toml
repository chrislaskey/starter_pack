[package]
name = "app_tauri"
description = "Starter Pack's desktop and mobile app: app_core behind Tauri commands, and the Svelte pages"
version.workspace = true
edition.workspace = true

[lib]
# Tauri's mobile targets link the app as a library; the `_lib` suffix keeps
# its name distinct from the binary's.
name = "app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app_core = { workspace = true, features = ["sync-http"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
