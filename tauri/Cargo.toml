[package]
name = "app_tauri"
description = "Starter Pack's desktop and mobile app: app_core behind Tauri commands, and the Svelte pages"
version.workspace = true
edition.workspace = true

[lib]
# Tauri's mobile targets link the app as a library; the `_lib` suffix keeps
# its name distinct from the binary's.
name = "app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app_core = { workspace = true, features = ["sync-http"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "fs", "rt"] }
uuid = { version = "1", features = ["serde"] }
# The device's name, for the community a local user starts with
whoami = "2"

# The clipboard's image types, see src/clipboard/, and the quick picker,
# see src/quick_picker/ and src/macos/
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-nspanel = "2.1"
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSURL", "NSArray", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSArray", "NSDictionary", "NSString"] }
objc2-ui-kit = { version = "0.3", features = ["UIImage", "UIPasteboard"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
