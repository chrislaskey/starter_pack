<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Pack</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <h1>Starter Pack</h1>
        <p class="muted">Server: <code id="server-url">…</code></p>
      </header>

      <section class="status" id="status" data-state="disconnected">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <p class="label" id="status-label">Starting…</p>
          <p class="muted" id="status-detail"></p>
        </div>
      </section>

      <section class="actions">
        <button id="log-in" hidden>Log in</button>
        <button id="open-phoenix">Open Phoenix</button>
        <button id="ping" hidden>Send auth.token.get</button>
        <button id="log-out" class="secondary" hidden>Log out</button>
      </section>

      <section>
        <h2>Log</h2>
        <ul id="log"></ul>
      </section>
    </main>
  </body>
</html>
